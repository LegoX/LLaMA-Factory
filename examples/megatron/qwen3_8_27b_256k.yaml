# Single node, 8 GPUs, TP4/PP2/CP1, GBS64. Replace paths and register weighted_sft.
# No GPU memory-fit guarantee: validate representative long samples on your hardware.
model_name_or_path: /path/to/Qwen3.8-27B
trust_remote_code: true
stage: sft
do_train: true
do_eval: false
finetuning_type: full

dataset_dir: /path/to/data
dataset: weighted_sft
template: qwen3_8
reasoning_effort: xhigh
preserve_thinking: true
turn_mask: true
trajectory_loss_weight: true
drop_long_sequences: false
cutoff_len: 262144
packing: false
neat_packing: false
overwrite_cache: false
preprocessing_num_workers: 1
dataloader_num_workers: 0
pad_train_samples_to_full_steps: true

output_dir: /path/to/saves/qwen3_8_27b_256k
logging_steps: 1
save_strategy: "no"
plot_loss: true
save_only_model: true
save_hf_model: false
report_to: none
run_name: qwen3_8_27b_256k

per_device_train_batch_size: 1
gradient_accumulation_steps: 64
learning_rate: 4.0e-05
adam_beta1: 0.9
adam_beta2: 0.98
weight_decay: 0.04
max_grad_norm: 1.0
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_steps: 5
lr_scheduler_kwargs:
  min_lr: 4.0e-06
bf16: true
accumulate_allreduce_grads_in_fp32: true
calculate_per_token_loss: true
ddp_timeout: 180000000
resume_from_checkpoint: null
seed: 1105
data_seed: 1105
mtp_num_layers: 0

tensor_model_parallel_size: 4
pipeline_model_parallel_size: 2
context_parallel_size: 1
sequence_parallel: true
variable_seq_lengths: true
transformer_impl: transformer_engine
cross_entropy_loss_fusion: true
recompute_granularity: full
use_distributed_optimizer: true
use_precision_aware_optimizer: true
optimizer_cpu_offload: false
overlap_param_gather: false
overlap_grad_reduce: false
empty_cache_before_grad_sync: true
ckpt_format: torch_dist
moe_token_dispatcher_type: alltoall
additional_configs:
  max_sequence_length: 262144
  position_embedding_type: mrope
