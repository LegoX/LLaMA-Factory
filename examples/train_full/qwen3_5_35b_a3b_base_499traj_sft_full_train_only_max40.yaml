### model
model_name_or_path: /public/storage/conghao/models/Qwen3.5-35B-A3B-Base
trust_remote_code: true

### method
stage: sft
do_train: true
do_eval: false
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_optim_offload_config.json

### dataset
dataset_dir: /public/storage/conghao/swe_data_process/production/programgen_pivot_500_deepseek_v4_pro_k8s
dataset: programgen_pivot_500
template: qwen3_6
cutoff_len: 262144
packing: false
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen3_5_35b_a3b_base_499traj_sft_full_train_only_max40_optim_offload
logging_steps: 1
save_strategy: steps
save_steps: 4
save_total_limit: null
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: qwen3_5_35b_a3b_base_499traj_sft_full_train_only_max40_optim_offload

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
num_train_epochs: 5.0
max_steps: 40
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
enable_liger_kernel: true
use_unsloth_gc: true
flash_attn: fa2

### eval
eval_strategy: "no"

# Phase-2 train-only notes:
# - same training recipe as qwen3_5_35b_a3b_base_499traj_sft_full_train_only_max16.yaml
# - max_steps 40 corresponds to approximately 5 epochs with this 499-sample setup
# - saves every 4 optimizer steps, approximately every half epoch, matching the previous ckpt cadence
# - save_total_limit: null keeps all half-epoch model-only checkpoints for downstream NL2Repo sweeps
# - save_only_model: true avoids storing full optimizer/ZeRO state, which would add hundreds of GB per checkpoint
