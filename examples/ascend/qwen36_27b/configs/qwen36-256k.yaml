# Replace /path/to paths before launching.
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-08
bf16: true
cutoff_len: 262144
data_seed: 42
dataset: train
disable_tqdm: true
do_train: true
enable_thinking: true
finetuning_type: full
flash_attn: fa2
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 5.0e-05
logging_steps: 1
lr_scheduler_type: cosine
max_grad_norm: 1.0
max_samples: null
model_name_or_path: /path/to/models/Qwen3.6-27B
num_train_epochs: 3.0
optim: adamw_torch
output_dir: /path/to/outputs/qwen36-256k
overwrite_cache: false
packing: false
per_device_train_batch_size: 1
preprocessing_num_workers: 8
preserve_thinking: true
pure_bf16: false
report_to: none
save_steps: 1
save_strategy: steps
save_total_limit: 2
seed: 42
stage: sft
template: qwen3_6
warmup_ratio: 0.1
weight_decay: 0.01
launcher:
  profile: qwen36_fsdp2
  device: npu
  nproc_per_node: 16
  min_host_available_gib: 128
  dataset_info:
    train:
      file_name: /path/to/data/train.json
      formatting: sharegpt
      columns:
        messages: messages
      tags:
        role_tag: role
        content_tag: content
        user_tag: user
        assistant_tag: assistant
        system_tag: system
